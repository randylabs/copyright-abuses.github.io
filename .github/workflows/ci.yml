name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - "**"
    paths-ignore:
      - "README.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      # Static Nuxt site: the build IS the gate (there are no unit tests). A
      # successful `generate` is what `bake` then packages into the image.
      - name: setup node
        uses: actions/setup-node@v4 # pin to a SHA to match repo policy
        with:
          node-version: "20"
          cache: npm
      - name: install
        run: npm ci
      - name: build
        run: npm run generate
  bake:
    name: Bake
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: ci
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1
      - name: set up buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: login registry
        run: |
          echo "${OCI_REGISTRY_PASSWD}" | docker login registry.randylabs.cloud \
            -u "${OCI_REGISTRY_USERNAME}" --password-stdin
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_REGISTRY_PASSWD: ${{ secrets.OCI_REGISTRY_PASSWD }}
      - name: setup cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/docker-build
          key: docker-build-main-${{ runner.os }}
      - name: Bundle and push
        id: bundle
        run: |
          ref=${{ github.sha }}
          image=registry.randylabs.cloud/randylabsdev/copyright-abuses:${ref}
          chart=0.0.0-${ref}
          docker buildx build --platform linux/arm64,linux/amd64 . --tag ${image} --push
          helm package chart --app-version=${chart} --version=${chart}
          helm push copyright-abuses-${chart}.tgz oci://registry.randylabs.cloud/randylabsdev/charts
          echo "image=${image}" >> $GITHUB_OUTPUT
