# nginx vhost for the prerendered Nuxt 3 static site (served on :80).
# A VM-hosted Caddy terminates TLS + CrowdSec/WAF and reverse-proxies here, so
# this config stays deliberately minimal: correct SPA routing + sane caching.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # Content-addressed Nuxt build assets — safe to cache hard.
    location /_nuxt/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA-aware routing for the prerendered site. Try the clean-URL route's
    # index.html BEFORE the bare directory, so /compliance serves
    # /compliance/index.html directly (HTTP 200) instead of 301-redirecting to
    # /compliance/ — the canonical URLs carry no trailing slash. Order:
    #   exact file → <route>/index.html → directory → Nuxt SPA shell (200.html).
    # A bare `GET /` returns index.html (200), satisfying the chart's probes.
    location / {
        try_files $uri $uri/index.html $uri/ /200.html;
    }
}
